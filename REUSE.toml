version = 1

[[annotations]]
path = ["**/*.md", ".claude/**", ".agent/**", "REUSE.toml", ".gitignore"]
SPDX-FileCopyrightText = "2026 ZeeOS contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["Makefile", "scripts/**", ".github/**/*.yml", ".github/CODEOWNERS"]
SPDX-FileCopyrightText = "2026 ZeeOS contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Original ZeeOS artwork (rendered by branding/wallpapers/src/render.py).
[[annotations]]
path = ["branding/wallpapers/*/metadata.json", "branding/wallpapers/*/contents/**", "branding/wallpapers/preview.jpg"]
SPDX-FileCopyrightText = "2026 ZeeOS contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Original Aurorae window decoration themes (rendered by branding/aurorae/src/render.py).
[[annotations]]
path = ["branding/aurorae/ZeeOS-*/**", "branding/aurorae/preview.png", "branding/aurorae/src/preview.svg"]
SPDX-FileCopyrightText = "2026 ZeeOS contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Boot-test screenshot baselines (P3-11, #136): screenshots of the ZeeOS desktop, whose wallpaper is
# the artwork above. The build/** entry below adds its notice too (aggregate).
[[annotations]]
path = ["build/arch/*/baselines/*.ppm", "build/arch/*/baselines/masks.txt"]
SPDX-FileCopyrightText = "2026 ZeeOS contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Code files carry their own SPDX-License-Identifier; this adds the copyright notice
# (agents keep forgetting SPDX-FileCopyrightText). Artwork in /branding is not covered.
[[annotations]]
path = ["build/**", "vm/**", "tests/**", "installer/**", "desktop/**", "security/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ZeeOS contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
