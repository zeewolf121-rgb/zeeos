# Fedora SRPM that ZeeOS rebuilds for sddm (ADR-0011 F3, #234). Shared by both arches.
# SRPM_SHA256 is written by 'make rpms-source-lock RPM=sddm ARCH=<arch>' from the real, Fedora-signed
# download. It is deliberately empty until that has run: build.sh refuses to build with an empty hash.
NAME=sddm
SRPM=sddm-0.21.0-13.fc44.src.rpm
SRPM_SHA256=
# Passed to rpmbuild: Fedora's own x11 bcond (used for RHEL 10) drops Requires: xorg-x11-xinit,
# which pulls in setxkbmap, and the sddm-x11 subpackage. ZeeOS is Wayland only (rule 3).
RPMBUILD_OPTS=--without x11
