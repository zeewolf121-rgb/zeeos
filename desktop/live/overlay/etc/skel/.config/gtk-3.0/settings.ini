# Per-user GTK3 theme for new users (liveuser via useradd -m). kde-gtk-config's first-login
# kconf_update (gtk_theme) reads only ~/.config/gtk-3.0/settings.ini and writes Breeze there when
# it names no theme, which overrides /etc/gtk-3.0/settings.ini (#143). Naming the theme here
# keeps adw-gtk3; the other keys still come from /etc/gtk-3.0/settings.ini.
[Settings]
gtk-theme-name=adw-gtk3
