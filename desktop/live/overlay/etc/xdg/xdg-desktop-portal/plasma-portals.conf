# Portal backends for the Plasma session (P2-3). The KDE backend serves
# org.freedesktop.appearance (colour-scheme, accent-color) from kdeglobals,
# which is what libadwaita and adw-gtk3 read; GTK is the fallback.
[preferred]
default=kde;gtk
org.freedesktop.impl.portal.Settings=kde
