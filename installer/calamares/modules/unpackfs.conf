# installer-disk (writes the new root only). Copies the live system's pristine read-only root,
# which kiwi's live boot mounts at /run/overlay/rootfsbase (seen in the live session: ext4 on
# loop1, ro). Not "/": unpackfs counts files with `find <source> -type f`, which walks /proc and
# /sys on the running root, exits 1 and fails the install; "/" would also carry live-session
# runtime changes. Live-only files are removed afterwards by shellprocess@zeelivecleanup and
# removeuser.
---
unpack:
  - source: "/run/overlay/rootfsbase"
    sourcefs: "file"
    destination: ""
    exclude:
      - "/dev/*"
      - "/proc/*"
      - "/sys/*"
      - "/run/*"
      - "/tmp/*"
      - "/var/tmp/*"
      - "/mnt/*"
      - "/media/*"
      - "/var/log/journal/*"
      - "/var/cache/dnf/*"
      - "/swapfile"
      - "/etc/machine-id"
      - "/etc/fstab"
      - "/etc/crypttab"
      - "/boot/efi/*"
