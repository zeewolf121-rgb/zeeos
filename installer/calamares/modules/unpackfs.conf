# installer-disk (writes the new root only). Copies the running live root with rsync, so it does
# not depend on how kiwi nests the squashfs/rootfs images. Runtime state and mounts are excluded;
# live-only files are removed afterwards by shellprocess@zeelivecleanup and removeuser.
---
unpack:
  - source: "/"
    sourcefs: "file"
    destination: ""
    exclude:
      - "/dev/*"
      - "/proc/*"
      - "/sys/*"
      - "/run/*"
      - "/tmp/*"
      - "/var/tmp/*"
      - "/mnt/*"
      - "/media/*"
      - "/var/log/journal/*"
      - "/var/cache/dnf/*"
      - "/swapfile"
      - "/etc/machine-id"
      - "/etc/fstab"
      - "/etc/crypttab"
      - "/boot/efi/*"
