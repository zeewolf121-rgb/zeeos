# installer-disk (writes SELinux labels inside the new root only). Runs right after unpackfs: the
# copied root carries generic labels (seen live: /etc/passwd was etc_t, so chpasswd, as passwd_t,
# was denied and the installed system would boot mislabeled). setfiles relabels the target from
# the image's own file_contexts, run on the host (same image, same policy). Done during the
# install, not with /.autorelabel, which would add a reboot on first boot.
---
dontChroot: true
timeout: 1800
script:
  - "setfiles -F -r ${ROOT} /etc/selinux/targeted/contexts/files/file_contexts ${ROOT}"
