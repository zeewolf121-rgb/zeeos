# Installed systems: no auto-login (MISSION §4), root locked, the first user is an admin (wheel).
---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - name: wheel
    must_exist: true
    system: true

doAutologin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: false
setRootPassword: false
doReusePassword: false

passwordRequirements:
  nonempty: true
  minLength: 6
allowWeakPasswords: false

user:
  shell: /bin/bash
  forbidden_names: [ root, liveuser ]

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "zeeos-${cpu}"
  forbidden_names: [ localhost ]

presets:
  fullName:
    editable: true
  loginName:
    editable: true
