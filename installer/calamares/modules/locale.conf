# English only (ADR-0009): the live session runs en_US.UTF-8, so that is the default locale.
# Upstream's language list stays as shipped; ZeeOS doesn't promise or test other languages.
---
region: "Etc"
zone: "UTC"
adjustLiveTimezone: false
# Fedora has no locale.gen; localecfg writes /etc/locale.conf from the chosen locale.
localeGenPath: "/etc/locale.gen"
# No GeoIP: no network lookups from the installer, and CI runs offline.
