# SDDM on Wayland (ADR-0005, rule 3), no auto-login on installed systems (users.conf doAutologin).
---
displaymanagers:
  - sddm
defaultDesktopEnvironment:
  executable: "startplasma-wayland"
  desktopFile: "plasma"
basicSetup: false
sysconfigSetup: false
