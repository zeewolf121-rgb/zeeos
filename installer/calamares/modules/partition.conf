# installer-disk. Erase / alongside (guided resize) / manual, optional LUKS2 (P4-2, ADR-0003).
# Fedora's default layout: ESP, unencrypted ext4 /boot, btrfs root. GRUB (ADR-0004) reads /boot
# directly, so only the btrfs root sits inside LUKS2.
# An existing ESP is reused, never formatted: Calamares' alongside/replace choices reuse the
# ESP it finds, and manual mode keeps "keep" as the default for existing partitions.
---
efiSystemPartition: "/boot/efi"
efi:
  recommendedSize: 600MiB
  minimumSize: 300MiB
  label: "EFI"

# Fedora uses zram instead of a swap partition.
userSwapChoices:
  - none
initialSwapChoice: none

drawNestedPartitions: false
alwaysShowPartitionLabels: true
# The user picks erase / alongside / manual explicitly; nothing is pre-selected.
initialPartitioningChoice: none
allowManualPartitioning: true

defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]

enableLuksAutomatedPartitioning: true
luksGeneration: luks2
showNotEncryptedBootMessage: false

partitionLayout:
  - name: "boot"
    filesystem: "ext4"
    mountPoint: "/boot"
    size: 2GiB
  - name: "root"
    filesystem: "btrfs"
    mountPoint: "/"
    size: 100%
    minSize: 20GiB
