# installer-disk (ESP). Config of zee-bootloader@zeeos (installer/modules/zee-bootloader/), which
# replaces Calamares' stock bootloader module (ADR-0004): Fedora's signed shim + GRUB are copied
# into \EFI\fedora\ only. \EFI\BOOT\ (possibly Windows' fallback loader) and \EFI\Microsoft\ are
# never written. The NVRAM entry, /etc/default/grub and the Windows entry are zee-bootmenu (P4-7).
---
# Where the shim-* and grub2-efi-* RPMs put their signed binaries in the live system.
signedSource: "/boot/efi/EFI/fedora"
