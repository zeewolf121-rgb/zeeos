# SPDX-License-Identifier: GPL-3.0-or-later
# shellprocess@zeelivecleanup (P4-2): remove the live-only parts from the *target* root.
# Runs inside the target chroot (dontChroot: false); it never touches a disk device, the ESP or the
# live system. liveuser and its home are removed by the removeuser module right after this.
# Sources of these files: build/common/config.sh, desktop/live/overlay/, build/arch/*/root/.
---
dontChroot: false
timeout: 120
script:
  # Live auto-login into Plasma (desktop/live/overlay). Installed systems log in normally.
  - "rm -f /etc/sddm.conf.d/10-zeeos-live-autologin.conf"
  # Serial-console root auto-login (build/arch/<arch>/root).
  - "rm -rf /etc/systemd/system/serial-getty@ttyS0.service.d /etc/systemd/system/serial-getty@ttyAMA0.service.d"
  # Guest test units and their scripts (boot-test markers), and their enable symlinks.
  - "systemctl disable zeeos-desktop-ready.service"
  - "rm -f /usr/lib/systemd/system/zeeos-desktop-ready.service /usr/lib/systemd/system/zeeos-theme-check.service /usr/lib/systemd/system/zeeos-theme-check-announce.service /usr/lib/systemd/system/zeeos-layout-check.service /usr/lib/systemd/system/zeeos-layout-check-announce.service"
  - "rm -f /usr/libexec/zeeos-desktop-ready /usr/libexec/zeeos-theme-check /usr/libexec/zeeos-layout-check"
  # Passwordless root (build/common/config.sh): lock the root account. Not `passwd -l`: it refuses
  # to lock an empty password ("Unsafe operation").
  - "usermod -p '!' root"
  # Fail the install if anything live-only survived or root is still unlocked.
  # No dollar signs anywhere in this list: Calamares expands them as installer variables and rejects
  # undefined ones before running any command, so the check uses find (prints only what still exists).
  - command: "sh -c 'if find /etc/sddm.conf.d/10-zeeos-live-autologin.conf /usr/lib/systemd/system/zeeos-desktop-ready.service /usr/libexec/zeeos-desktop-ready -maxdepth 0 2>/dev/null | grep -q .; then echo \"live-only file left\" >&2; exit 1; fi; getent shadow root | cut -d: -f2 | grep -q \"^!\"'"
    timeout: 30
