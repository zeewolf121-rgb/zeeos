# Wayland keyboard path (ADR-0011 item 2): Calamares sets the live keymap through
# org.freedesktop.locale1 and KWin follows it (the live kwinrc has [Wayland] FollowLocale1=true).
# No setxkbmap, and no kxkbrc rewrite. On the target, 00-keyboard.conf is where systemd-localed
# stores the layout on Fedora (read by KWin through locale1); it isn't an X server config.
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: false
useLocale1: true
configure:
  kwin: false
