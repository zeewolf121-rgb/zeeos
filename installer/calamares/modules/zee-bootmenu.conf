# installer-disk (NVRAM, target /boot). Config of zee-bootmenu (installer/modules/zee-bootmenu/,
# ADR-0004): /etc/default/grub with ZeeOS default and a 5 s timeout, os-prober plus a static
# Windows chainload entry by ESP UUID, grub2-mkconfig, and one NVRAM entry ZeeOS. Nothing on the
# ESP is written and no NVRAM entry is removed or renumbered.
---
# Put ZeeOS first in BootOrder (ADR-0004). false appends it instead; the globalstorage key
# zeeNvramFirst=false (an installer page or preset) does the same.
nvramFirst: true
