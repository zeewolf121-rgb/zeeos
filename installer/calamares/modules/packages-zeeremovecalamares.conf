# SPDX-License-Identifier: GPL-3.0-or-later
# packages@zeeremovecalamares (ADR-0011 item 6): the installer isn't part of the installed system,
# so a later Fedora calamares can never pull setxkbmap back in. Offline: dnf removes only.
---
# `dnf` runs /usr/bin/dnf, which is dnf5 on Fedora 44.
backend: dnf
skip_if_no_internet: false
update_db: false
update_system: false
operations:
  - remove:
      - calamares
      - calamares-libs
