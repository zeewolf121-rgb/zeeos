# SPDX-License-Identifier: GPL-3.0-or-later
# ZeeOS Calamares sequence (P4-2, #176; ADR-0003, ADR-0004, ADR-0009, ADR-0011).
# Installed as /etc/calamares/settings.conf; module configs go to /etc/calamares/modules/,
# branding to /etc/calamares/branding/zeeos/, zee-* modules to /usr/lib/calamares/modules/.
# installer-disk: partition, mount, unpackfs, fstab, bootloader and zee-espbackup write disks or the
# ESP; zee-bootmenu writes NVRAM. `installer/tools/zee-plan.py` is the dry run: it prints every planned disk operation of
# this sequence without touching a disk.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: zeerelabel
    module: shellprocess
    config: shellprocess-zeerelabel.conf
  - id: zeelivecleanup
    module: shellprocess
    config: shellprocess-zeelivecleanup.conf
  - id: zeeremovecalamares
    module: packages
    config: packages-zeeremovecalamares.conf
  - id: zeeos
    module: zee-bootloader
    config: bootloader.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      # Slot: zee-preflight (P4-3/P4-4), right after partition so it sees the chosen layout.
      - users
      # Slot: zee-summary (P4-6) replaces this stock page once the image builds its C++ plugin;
      # until then the image has no .so for it and Calamares would refuse to start.
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - shellprocess@zeerelabel
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      # No luksbootkeyfile: /boot is unencrypted (partition.conf), so a keyfile in the
      # initramfs would put the root key in the clear. LUKS2 root asks once, in the initramfs.
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess@zeelivecleanup
      - removeuser
      - packages@zeeremovecalamares
      - dracut
      # zee-espbackup (P4-5) runs before the first ESP write (zee-bootloader).
      - zee-espbackup
      # Not the stock bootloader module: it would run grub2-install (unsigned image, ADR-0004).
      - zee-bootloader@zeeos
      # zee-bootmenu (P4-7), after the boot files exist: /etc/default/grub, Windows entry,
      # grub2-mkconfig, NVRAM entry ZeeOS first.
      - zee-bootmenu
      - umount
  - show:
      - finished

branding: zeeos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
