# Unattended (CI only) Calamares sequence, P4-9 #181. installer-disk.
# Installed as /usr/share/zeeos/autoinstall/settings.conf; zeeos-autoinstall runs Calamares with it
# only when the ZEEOS-AUTOINSTALL preset disk is present. Exec-only: no view module runs, so the
# jobs the interactive pages would create come from zee-autopart (erase / luks layout) and
# zee-autopreset (user, test-only first-boot marker unit). locale/keyboard are not needed: the
# target keeps the live image's en_US.UTF-8 / us settings (ADR-0009).
# zee-preflight runs first and the preset has no way to remove it; zeeos-autoinstall refuses to
# start when the module is missing.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: zeelivecleanup
    module: shellprocess
    config: shellprocess-zeelivecleanup.conf
  - id: zeeremovecalamares
    module: packages
    config: packages-zeeremovecalamares.conf
  - id: zeeos
    module: zee-bootloader
    config: bootloader.conf

sequence:
  - exec:
      - zee-preflight
      - zee-autopart
      - mount
      - unpackfs
      - machineid
      - fstab
      - zee-autopreset
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess@zeelivecleanup
      - removeuser
      - packages@zeeremovecalamares
      - dracut
      - zee-espbackup
      - zee-bootloader@zeeos
      - umount
      - zee-autodone

branding: zeeos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: true
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: true
