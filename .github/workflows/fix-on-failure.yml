# CI follow-up for agent PRs (docs/AUTOPILOT.md §4). On failure: send the CI summary back to
# the authoring model, at most 2 retries per PR, then needs-human + owner ping. On success:
# request the cross-model review of that commit, or merge if every gate already passes.
name: fix-on-failure
on:
  workflow_run:
    workflows: [lint, build-iso]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  checks: read          # gates.sh reads check runs (lint, build-iso, boot-test)
  actions: write
jobs:
  follow-up:
    if: >-
      vars.AUTOPILOT == 'on' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: follow-up-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CODEX_TOKEN: ${{ secrets.CODEX_TRIGGER_TOKEN }}
      MERGE_TOKEN: ${{ secrets.AUTOPILOT_MERGE_TOKEN }}   # optional: merges workflow-changing PRs
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      RUN: ${{ github.event.workflow_run.id }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          if [[ "$CONCLUSION" == failure ]]; then
            scripts/autopilot/fix-retry.sh "$BRANCH" "$SHA" "$RUN"
          else
            pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
            if [[ -n "$pr" ]]; then
              scripts/autopilot/gates.sh status "$pr"
              scripts/autopilot/gates.sh merge "$pr" || true
            fi
          fi
