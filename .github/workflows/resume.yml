# Re-dispatch `paused` issues oldest-first within the concurrency caps (docs/AUTOPILOT.md §6).
name: resume
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: write
env:
  AUTOPILOT_CONTROLLER_MODE: ${{ vars.AUTOPILOT_CONTROLLER }}
jobs:
  resume:
    if: vars.AUTOPILOT == 'on' && (vars.AUTOPILOT_CONTROLLER == '' || vars.AUTOPILOT_CONTROLLER == 'legacy')
    concurrency:
      group: autopilot
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - run: scripts/autopilot/dispatch.sh --resume
