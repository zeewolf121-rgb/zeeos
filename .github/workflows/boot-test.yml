# Boot tests (#13): arch × Secure Boot on/off under QEMU via `make boot-test` (vm/boot-test.sh).
# Called by build-iso after a successful build, so the iso-<arch> artifacts come from the same
# run. To run by hand, dispatch build-iso. Phase 1 exit criterion (docs/phases/phase-1.md): all
# four cells reach ZEEOS_DESKTOP_READY, with a screenshot.
name: boot-test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  selftest:
    name: Boot harness fixture self-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Replay boot marker fixtures
        run: bash tests/selftest.sh
  boot:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        sb: ['on', 'off']
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            pkgs: qemu-system-x86 ovmf
            timeout: 600
          # GitHub's arm64 runners have no /dev/kvm, so aarch64 runs under TCG: allow longer.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            pkgs: qemu-system-arm qemu-efi-aarch64
            timeout: 1800
    name: boot (${{ matrix.arch }}, sb-${{ matrix.sb }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ARCH: ${{ matrix.arch }}
      SB: ${{ matrix.sb }}
      OUT: out/boot-test/${{ matrix.arch }}-sb${{ matrix.sb }}
      TIMEOUT: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v5
      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ${{ matrix.pkgs }} ipxe-qemu qemu-utils python3
          ls /usr/share/OVMF /usr/share/AAVMF 2>/dev/null || true
      - name: Enable KVM
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          else
            echo "no /dev/kvm on this runner; QEMU falls back to TCG"
          fi
      - name: Download the ISO
        uses: actions/download-artifact@v6
        with:
          name: iso-${{ matrix.arch }}
          path: out/${{ matrix.arch }}/image
      - name: Boot
        run: |
          iso="$(find "out/$ARCH/image" -name '*.iso' | head -n1)"
          [[ -n "$iso" ]] || { echo "::error::no ISO in iso-$ARCH artifact"; exit 1; }
          make boot-test ARCH="$ARCH" SECUREBOOT="$SB" ISO="$iso" OUT="$OUT"
      - name: Summary (boot time, idle RAM, per-step results)
        if: always()
        run: |
          # P2-5 records these as junit properties; MISSION §6 caps idle RAM at 1.2 GB.
          prop() { sed -n "s/.*<property name=\"$1\" value=\"\([^\"]*\)\".*/\1/p" "$OUT/junit.xml" 2>/dev/null | head -n1; }
          boot="$(prop boot_seconds)"; used="$(prop idle_used_kb)"; total="$(prop idle_total_kb)"
          theme="$(prop theme_check)"; diff="$(prop light_dark_diff_pct)"
          mib() { [[ -n "$1" ]] && echo "$(( $1 / 1024 )) MiB" || echo n/a; }
          { echo "### boot $ARCH sb-$SB: accel $(cat "$OUT/accel" 2>/dev/null || echo n/a)"
            echo "| boot time | idle RAM used | RAM total | theme check | light/dark diff |"
            echo "|---|---|---|---|---|"
            echo "| ${boot:-n/a} s | $(mib "$used") | $(mib "$total") | ${theme:-n/a} | ${diff:-n/a}${diff:+ %} |"
            if [[ -n "$used" ]] && (( used > 1258291 )); then echo; echo "⚠️ idle RAM above the 1.2 GB target (MISSION §6)"; fi
            # Per-step results: one boot.step testcase per theme/layout step (vm/boot-test.sh).
            steps="$(grep -a 'classname="boot.step"' "$OUT/junit.xml" 2>/dev/null || true)"
            if [[ -n "$steps" ]]; then
              echo; echo "| step | result | screenshot |"; echo "|---|---|---|"
              while IFS= read -r l; do
                nm="$(sed -n 's/.*name="[^"]*\.\([^".]*\)".*/\1/p' <<<"$l")"
                case $l in
                  *'<skipped/>'*) r=skipped ;;
                  *'<failure '*) r="❌ $(sed -n 's/.*<failure message="\([^"]*\)".*/\1/p' <<<"$l")" ;;
                  *) r=ok ;;
                esac
                f="$OUT/screenshot-$nm.ppm"
                if [[ -s "$f" ]]; then shot="$(stat -c %s "$f") bytes"; else shot=missing; fi
                echo "| $nm | $r | $shot |"
              done <<<"$steps"
            fi
            echo '```'; tail -n 40 "$OUT/serial.log" 2>/dev/null || echo "(no serial log)"; echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          if [[ -n "$used" ]] && (( used > 1258291 )); then echo "::warning::idle RAM $(mib "$used") is above 1.2 GB"; fi
          # The guest's markers in the job log too: the summary and artifact aren't readable
          # everywhere the log is, and a theme-check failure names its reason only here.
          grep -a -E '^ZEEOS_|secureboot: Secure boot' "$OUT/serial.log" 2>/dev/null || echo "(no guest markers in serial log)"
          fail="$(grep -a -m1 -E '^ZEEOS_(THEME|LAYOUT|RTL)_FAIL' "$OUT/serial.log" 2>/dev/null || true)"
          if [[ -n "$fail" ]]; then echo "::error::$fail"; fi
      - name: Upload serial log, every step's screenshot and JUnit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: boot-${{ matrix.arch }}-sb${{ matrix.sb }}
          path: |
            ${{ env.OUT }}/serial.log
            ${{ env.OUT }}/screenshot*.ppm
            ${{ env.OUT }}/junit.xml
            ${{ env.OUT }}/accel
            ${{ env.OUT }}/qemu.stderr
          if-no-files-found: ignore
          retention-days: 14
