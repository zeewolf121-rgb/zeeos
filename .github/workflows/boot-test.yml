# Boot tests (#13): arch × Secure Boot on/off under QEMU via `make boot-test` (vm/boot-test.sh).
# Called by build-iso after a successful build, so the iso-<arch> artifacts come from the same
# run. To run by hand, dispatch build-iso. Phase 1 exit criterion (docs/phases/phase-1.md): all
# four cells reach ZEEOS_DESKTOP_READY, with a screenshot.
name: boot-test
on:
  workflow_call:
permissions:
  contents: read
  actions: read   # scripts/fetch-artifact.sh reads this run's artifact through the REST API
jobs:
  selftest:
    name: Boot harness fixture self-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Replay boot marker fixtures
        run: bash tests/selftest.sh
  boot:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        sb: ['on', 'off']
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            pkgs: qemu-system-x86 ovmf
            timeout: 600
          # aarch64 runs on the owner's self-hosted Mac (HVF, #15; two runner instances so both
          # cells run at once). Fork PRs stay on GitHub's arm64 runner (TCG, slow), so code from a
          # fork never reaches the Mac. The TCG timeout stays as the upper bound.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            pkgs: qemu-system-arm qemu-efi-aarch64
            timeout: 1800
    name: boot (${{ matrix.arch }}, sb-${{ matrix.sb }})
    runs-on: ${{ (matrix.arch == 'aarch64' && github.event.pull_request.head.repo.fork != true) && fromJSON('["self-hosted", "macOS", "ARM64", "zeeos-aarch64"]') || matrix.runner }}
    timeout-minutes: 45
    env:
      ARCH: ${{ matrix.arch }}
      SB: ${{ matrix.sb }}
      OUT: out/boot-test/${{ matrix.arch }}-sb${{ matrix.sb }}
      TIMEOUT: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v5
      - name: Install QEMU and UEFI firmware
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ${{ matrix.pkgs }} ipxe-qemu qemu-utils python3
          ls /usr/share/OVMF /usr/share/AAVMF 2>/dev/null || true
      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          else
            echo "no /dev/kvm on this runner; QEMU falls back to TCG"
          fi
      # Homebrew's QEMU has no aarch64 Secure Boot firmware. Take the same AAVMF build the Ubuntu
      # runners use (qemu-efi-aarch64 2024.02-2ubuntu0.10) and pin it by hash: a changed package
      # fails here instead of silently testing other firmware.
      - name: AArch64 UEFI firmware (macOS)
        if: runner.os == 'macOS'
        run: |
          echo /opt/homebrew/bin >>"$GITHUB_PATH"; export PATH="/opt/homebrew/bin:$PATH"
          fw="$RUNNER_TEMP/aavmf"; mkdir -p "$fw"
          podman run --rm -v "$fw:/o" docker.io/library/ubuntu:24.04 sh -c 'apt-get update -qq &&
            apt-get install -yqq --no-install-recommends qemu-efi-aarch64 >/dev/null &&
            cp /usr/share/AAVMF/AAVMF_CODE.ms.fd /usr/share/AAVMF/AAVMF_VARS.ms.fd \
               /usr/share/AAVMF/AAVMF_CODE.no-secboot.fd /usr/share/AAVMF/AAVMF_VARS.fd /o/'
          (cd "$fw" && shasum -a 256 -c) <<'SUMS' || { echo "::error::AAVMF changed upstream; check it and update the pinned hashes"; exit 1; }
          d37119b2c1173ecdc88d09c00848842fdf575899403b7549a5b51f06766c20d6  AAVMF_CODE.ms.fd
          bdd5b6f03eecf9b18e395925012764c9100cdcf164a0e5aa4373017d3d75534b  AAVMF_VARS.ms.fd
          545e2eda871a00dba51c0df48a34829fe3b0de6ec10ea760c75f1fc1c6a29dc5  AAVMF_CODE.no-secboot.fd
          b3b855c5a80310168051164986855692d1bdb06e67619856177965cd87c6774f  AAVMF_VARS.fd
          SUMS
          if [[ "$SB" == on ]]; then code=AAVMF_CODE.ms.fd vars=AAVMF_VARS.ms.fd; else code=AAVMF_CODE.no-secboot.fd vars=AAVMF_VARS.fd; fi
          { echo "FW_CODE=$fw/$code"; echo "FW_VARS=$fw/$vars"; } >>"$GITHUB_ENV"
      # Parallel range download: the artifact blob throttles each connection (the self-hosted Mac
      # got ~0.1 MB/s per stream, hours for one ISO). Falls back to download-artifact on any failure.
      - name: Download the ISO (parallel)
        id: fetch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-artifact.sh "${{ github.run_id }}" "iso-${{ matrix.arch }}" "out/${{ matrix.arch }}/image"
      - name: Download the ISO
        if: steps.fetch.outcome != 'success'
        uses: actions/download-artifact@v6
        with:
          name: iso-${{ matrix.arch }}
          path: out/${{ matrix.arch }}/image
      - name: Boot
        run: |
          iso="$(find "out/$ARCH/image" -name '*.iso' | head -n1)"
          [[ -n "$iso" ]] || { echo "::error::no ISO in iso-$ARCH artifact"; exit 1; }
          make boot-test ARCH="$ARCH" SECUREBOOT="$SB" ISO="$iso" OUT="$OUT"
      - name: Summary (boot time, idle RAM, per-step results)
        if: always()
        run: |
          # P2-5 records these as junit properties; MISSION §6 caps idle RAM at 1.2 GB.
          prop() { sed -n "s/.*<property name=\"$1\" value=\"\([^\"]*\)\".*/\1/p" "$OUT/junit.xml" 2>/dev/null | head -n1; }
          boot="$(prop boot_seconds)"; used="$(prop idle_used_kb)"; total="$(prop idle_total_kb)"
          theme="$(prop theme_check)"; diff="$(prop light_dark_diff_pct)"
          mib() { [[ -n "$1" ]] && echo "$(( $1 / 1024 )) MiB" || echo n/a; }
          { echo "### boot $ARCH sb-$SB: accel $(cat "$OUT/accel" 2>/dev/null || echo n/a)"
            echo "| boot time | idle RAM used | RAM total | theme check | light/dark diff |"
            echo "|---|---|---|---|---|"
            echo "| ${boot:-n/a} s | $(mib "$used") | $(mib "$total") | ${theme:-n/a} | ${diff:-n/a}${diff:+ %} |"
            if [[ -n "$used" ]] && (( used > 1258291 )); then echo; echo "⚠️ idle RAM above the 1.2 GB target (MISSION §6)"; fi
            # Per-step results: one boot.step testcase per theme/layout step (vm/boot-test.sh).
            steps="$(grep -a 'classname="boot.step"' "$OUT/junit.xml" 2>/dev/null || true)"
            if [[ -n "$steps" ]]; then
              echo; echo "| step | result | screenshot |"; echo "|---|---|---|"
              while IFS= read -r l; do
                nm="$(sed -n 's/.*name="[^"]*\.\([^".]*\)".*/\1/p' <<<"$l")"
                case $l in
                  *'<skipped/>'*) r=skipped ;;
                  *'<failure '*) r="❌ $(sed -n 's/.*<failure message="\([^"]*\)".*/\1/p' <<<"$l")" ;;
                  *) r=ok ;;
                esac
                f="$OUT/screenshot-$nm.ppm"
                if [[ -s "$f" ]]; then shot="$(wc -c <"$f" | tr -d ' ') bytes"; else shot=missing; fi
                echo "| $nm | $r | $shot |"
              done <<<"$steps"
            fi
            echo '```'; tail -n 40 "$OUT/serial.log" 2>/dev/null || echo "(no serial log)"; echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          if [[ -n "$used" ]] && (( used > 1258291 )); then echo "::warning::idle RAM $(mib "$used") is above 1.2 GB"; fi
          # The guest's markers in the job log too: the summary and artifact aren't readable
          # everywhere the log is, and a theme-check failure names its reason only here.
          grep -a -E '^ZEEOS_|secureboot: Secure boot' "$OUT/serial.log" 2>/dev/null || echo "(no guest markers in serial log)"
          fail="$(grep -a -m1 -E '^ZEEOS_(THEME|LAYOUT)_FAIL' "$OUT/serial.log" 2>/dev/null || true)"
          if [[ -n "$fail" ]]; then echo "::error::$fail"; fi
      - name: Upload serial log, every step's screenshot and JUnit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: boot-${{ matrix.arch }}-sb${{ matrix.sb }}
          path: |
            ${{ env.OUT }}/serial.log
            ${{ env.OUT }}/screenshot*.ppm
            ${{ env.OUT }}/junit.xml
            ${{ env.OUT }}/accel
            ${{ env.OUT }}/qemu.stderr
          if-no-files-found: ignore
          retention-days: 14
