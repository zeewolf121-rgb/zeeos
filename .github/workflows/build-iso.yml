# Builds the ISOs and boot-tests them. Runs on every PR so `build-iso` and `boot-test` always
# report (they're required checks): the matrix only runs when ISO inputs changed, and the two
# summary jobs pass as "not affected" otherwise. Also called by nightly-health and release.
# Uploads iso-<arch> (release.yml) and build-log-<arch>; size check < 4 GB. Container caching needs
# build/container/run.sh support (image-builder follow-up). P1-8 adds SB on/off.
name: build-iso
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      iso: ${{ steps.d.outputs.iso }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: d
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          iso=true
          if [[ "$EVENT" == pull_request ]]; then
            files="$(git diff --name-only "$BASE"...HEAD)"
            hits="$(grep -E '^(build/|Makefile$|\.github/workflows/(build-iso|boot-test)\.yml$)' <<<"$files" | grep -v '\.md$' || true)"
            [[ -n "$hits" ]] || iso=false
          fi
          echo "iso=$iso" >>"$GITHUB_OUTPUT"
  build:
    needs: changes
    if: needs.changes.outputs.iso == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - name: Build the ISO
        run: |
          mkdir -p out
          set -o pipefail
          make iso ARCH="$ARCH" 2>&1 | tee "out/build-$ARCH.log"
      - name: Size check (hybrid ISO must stay under 4 GB, MISSION §3)
        run: |
          iso="$(find "out/$ARCH/image" -name '*.iso' | head -n1)"
          [[ -n "$iso" ]] || { echo "::error::no ISO under out/$ARCH/image"; exit 1; }
          size="$(stat -c %s "$iso")"
          echo "$(basename "$iso"): $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          (( size < 4000000000 )) || { echo "::error::$iso is $size bytes (limit 4000000000)"; exit 1; }
      - name: Upload ISO (release.yml downloads iso-*)
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.arch }}
          path: out/${{ matrix.arch }}/image/*.iso
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}
          compression-level: 0
      - name: Upload build log and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: |
            out/build-${{ matrix.arch }}.log
            out/${{ matrix.arch }}/packages.list
            out/${{ matrix.arch }}/eltorito.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Failure summary (MISSION §11: agents read this, not raw logs)
        if: failure()
        run: |
          { echo "### build-iso $ARCH failed"; echo '```'; tail -n 40 "out/build-$ARCH.log" 2>/dev/null; echo '```'
            echo "Full summary: scripts/ci-summary.sh ${{ github.run_id }}"; } >>"$GITHUB_STEP_SUMMARY"
  boot:
    needs: build
    uses: ./.github/workflows/boot-test.yml
  build-iso:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          if [[ "${{ needs.changes.outputs.iso }}" != true ]]; then echo "no ISO inputs changed"; exit 0; fi
          [[ "${{ needs.build.result }}" == success ]]
  boot-test:
    needs: [changes, boot]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          if [[ "${{ needs.changes.outputs.iso }}" != true ]]; then echo "no ISO inputs changed"; exit 0; fi
          [[ "${{ needs.boot.result }}" == success ]]
